<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Primary mathematics curriculum comparison for China, England and US frameworks.">
  <title>MathBridge CN</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="teacher-mode.css">
  <link rel="stylesheet" href="product-shell.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">M</div>
        <div>
          <div class="brand-name">MathBridge CN</div>
          <div class="brand-sub" id="brandSub">小学数学课程与教学对照</div>
        </div>
      </div>
      <div class="header-actions">
        <span class="status-pill" id="researchStatus">研究数据 · 2026-08-18</span>
        <button class="lang-btn" id="langBtn" type="button">EN</button>
      </div>
    </div>
  </header>

  <main class="app-shell">
    <aside class="controls" id="controls" aria-label="Filters">
      <section class="control-section">
        <label class="control-label" id="gradeLabel">中国年级</label>
        <div class="segment" role="group" aria-label="China grade">
          <button class="seg-btn" data-grade="1" type="button">1</button>
          <button class="seg-btn" data-grade="2" type="button">2</button>
          <button class="seg-btn active" data-grade="3" type="button">3</button>
          <button class="seg-btn" data-grade="4" type="button">4</button>
          <button class="seg-btn" data-grade="5" type="button">5</button>
          <button class="seg-btn" data-grade="6" type="button">6</button>
        </div>
      </section>

      <section class="control-section">
        <label class="control-label" id="semesterLabel">学期</label>
        <div class="segment" role="group" aria-label="Semester">
          <button class="seg-btn active" id="semesterAll" data-semester="all" type="button">全年</button>
          <button class="seg-btn" id="semesterUpper" data-semester="upper" type="button">上册</button>
          <button class="seg-btn" id="semesterLower" data-semester="lower" type="button">下册</button>
        </div>
      </section>

      <section class="control-section">
        <label class="control-label" id="compareLabel">对照课程</label>
        <div class="segment two" role="group" aria-label="Comparison framework">
          <button class="seg-btn active" data-system="England" type="button">England</button>
          <button class="seg-btn" data-system="US" type="button">US</button>
        </div>
        <div id="stateWrap" class="hidden" style="margin-top:8px">
          <label class="control-label" id="usLayerLabel" for="usJurisdiction">美国课程层</label>
          <select class="select" id="usJurisdiction">
            <option value="Common Core baseline">US — Common Core baseline</option>
            <option value="California">California</option>
            <option value="Texas">Texas</option>
          </select>
        </div>
      </section>

      <section class="control-section">
        <label class="control-label" id="scopeLabel">浏览范围</label>
        <div class="segment two" role="group" aria-label="Browse scope">
          <button class="seg-btn active" id="scopeGrade" data-scope="grade" type="button">当前年级教材</button>
          <button class="seg-btn" id="scopeAll" data-scope="all" type="button">全部概念</button>
        </div>
      </section>

      <section class="control-section">
        <label class="control-label" for="searchInput">搜索 / Search</label>
        <input class="search" id="searchInput" type="search" autocomplete="off" placeholder="搜索数学概念">
      </section>

      <section class="control-section">
        <div class="control-label">主题 / Topics</div>
        <div class="topic-count" id="topicCount"></div>
        <div class="topic-list" id="topicList"></div>
      </section>
    </aside>

    <section class="content" aria-live="polite">
      <div class="mobile-controls"><button id="mobileFilterBtn" type="button">筛选</button></div>
      <div class="loading" id="loading">Loading research data…</div>
      <div id="content"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <span id="footer1">对照按数学概念匹配，不按相同年级编号自动对应。</span>
      <span id="footer2">人教版是教材对照层之一，不代表中国所有学校使用同一教材。</span>
    </div>
  </footer>

  <script src="runtime-diagnostics.js" defer></script>
  <script src="app.js" defer></script>
  <script src="progression.js" defer></script>
  <script src="teacher-mode.js" defer></script>
  <script src="teacher-mode-polish.js" defer></script>
  <script src="product-shell.js" defer></script>
</body>
</html>
